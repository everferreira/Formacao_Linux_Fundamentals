# =============================================================================
#  nginx.conf — Configuração de Proxy Reverso com Balanceamento de Carga
# =============================================================================
#  Descrição:
#    Configuração do Nginx atuando como proxy reverso, distribuindo o tráfego
#    entre três servidores web em round-robin.
#
#  Baseado na formação Linux Fundamentals (DIO) — Módulo 04.
#
#  Autor: Ever Ferreira
#  Repositório: https://github.com/everferreira/Formacao_Linux_Fundamentals
# =============================================================================

events {
    worker_connections 1024;
}

http {
    # ─── Upstream: pool de servidores para balanceamento ──────────────────────
    # Algoritmo round-robin (default). Para sticky sessions, adicione "ip_hash;"
    upstream backend_pool {
        server 172.31.0.37:80 weight=3;
        server 172.31.0.151:80 weight=2;
        server 172.31.0.149:80 weight=1;
    }

    # ─── Server: escuta na porta 4500 ────────────────────────────────────────
    server {
        listen 4500;
        server_name _;

        # Headers de segurança
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        location / {
            proxy_pass http://backend_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}